name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # Every hardcoded version string must match package.json, otherwise the
      # store build and the npm package drift apart.
      - name: Verify version strings
        run: npm run version:check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # The build also validates that every file referenced by the manifest
      # and every relative import of a runtime module made it into dist/.
      - name: Build
        run: npm run build
