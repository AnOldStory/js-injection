name: Release & Publish to Chrome Web Store

on:
  push:
    tags:
      - "v*.*.*"   # v3.0.0 같은 태그 push 시 자동 실행

jobs:
  release:
    name: Build, Release, Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write   # GitHub Release 생성
      id-token: write   # npm Trusted Publishing(OIDC) 토큰 발급

    steps:
      # ── 1. 코드 체크아웃 ──────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v7

      # ── 2. Node.js 설정 ──────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # npm의 Trusted Publishing(OIDC)은 npm 11.5.1 이상이 필요하다.
          # Node 22는 npm 10.x라 안 되고, Node 24가 npm 11.x를 들고 온다.
          node-version: 24
          cache: "npm"
          registry-url: "https://registry.npmjs.org"

      # ── 3. 의존성 설치 ───────────────────────────────────────────
      - name: Install dependencies
        run: npm install --legacy-peer-deps
        env:
          # playwright는 스토어 스크린샷 캡처용 devDependency다.
          # 릴리스 빌드에는 브라우저가 필요 없으므로 다운로드를 건너뛴다.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      # ── 4. 태그 ↔ 버전 문자열 일치 확인 ──────────────────────────
      # 태그와 package.json이 어긋나거나 README/manifest/mcp-server의 버전이
      # 밀려 있으면 스토어에 올라가기 전에 여기서 멈춘다.
      - name: Verify version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          npm run version:check

      # ── 5. 린트 ──────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── 6. 프로덕션 빌드 ─────────────────────────────────────────
      - name: Build
        run: npm run build

      # ── 7. dist/ 폴더를 zip으로 압축 ─────────────────────────────
      - name: Create zip
        run: |
          cd dist
          python3 -c "
          import zipfile, os
          with zipfile.ZipFile('../extension.zip', 'w', zipfile.ZIP_DEFLATED) as zf:
              for root, dirs, files in os.walk('.'):
                  for file in files:
                      filepath = os.path.join(root, file)
                      arcname = os.path.relpath(filepath, '.')
                      zf.write(filepath, arcname)
          print('extension.zip created')
          "

      # ── 8. GitHub Release 생성 + zip 첨부 ────────────────────────
      # 변경 이력은 리포에 따로 두지 않는다. 릴리스 본문은 이전 태그 이후의
      # 커밋 제목으로 자동 생성되므로, 노트 품질은 곧 커밋 메시지 품질이다.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: extension.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 9. Chrome Web Store 업로드 & 게시 ────────────────────────
      - name: Publish to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v6
        with:
          file-path: extension.zip
          extension-id: mijnijeicfcodlijkmafknapfcilffni
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true   # false로 하면 업로드만 하고 게시는 수동으로

      # ── 10. npm 배포 (MCP 서버) ──────────────────────────────────
      # README가 `npx -y js-injection-mcp`를 안내하므로 확장과 같은 버전이
      # npm에도 올라가야 한다. 인증은 토큰이 아니라 Trusted Publishing(OIDC)이라
      # 시크릿이 필요 없다 — npmjs.com > js-injection-mcp > Settings에서
      # 이 리포와 release.yml을 Trusted Publisher로 등록해두면 된다.
      # 확장 배포가 끝난 뒤에 두어, 여기서 실패해도 스토어 게시는 이미 끝나 있다.
      - name: Publish to npm
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "js-injection-mcp@$VERSION" version >/dev/null 2>&1; then
            echo "js-injection-mcp@$VERSION is already on npm — skipping"
            exit 0
          fi
          npm publish --access public
